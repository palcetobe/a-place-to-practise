name: Publish reviewed pilot to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout public pilot source
        uses: actions/checkout@v6
      - name: Verify and unpack exact reviewed static application
        run: |
          echo "d52c8bb0f5c393b97058f5cb9d46dd8c634fc7d4f1fc7eba8921b3e668c9b64e  pilot-runtime.zip" | sha256sum --check --strict
          unzip -q pilot-runtime.zip -d _site
          echo "34650442bd159f29348514f61ccb52c5872ab8444c7bdc0620529ed349f756b0  _site/index.html" | sha256sum --check --strict
          test "$(find _site -type f | wc -l)" -eq 79
      - name: Add standalone review prototypes without changing the application
        run: |
          echo "b88225f7738e1ecada14a7f6eecec7b27b1ca6e944b8237b76fff145380777c5  standalone-previews.zip" | sha256sum --check --strict
          unzip -q standalone-previews.zip -d _site
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static application only
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish Pages
        id: deployment
        uses: actions/deploy-pages@v4
