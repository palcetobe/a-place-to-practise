name: Publish reviewed pilot to Pages
on:
  push:
    branches: [main]
    # Runtime uploads stage a release; updating its pinned hashes publishes it.
    paths: ['.github/workflows/deploy.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout public pilot source
        uses: actions/checkout@v6
      - name: Verify and unpack exact reviewed static application
        run: |
          echo "943de2e66c749eb7d3e80213cb86053737ada29a53b21e61e63e33752ae95735  pilot-runtime.zip" | sha256sum --check --strict
          unzip -q pilot-runtime.zip -d _site
          echo "c31eb1bf618296b92a7cea17ab1e2a4ff342b4b1cf54b1c05e6d32ae88973130  _site/index.html" | sha256sum --check --strict
          test "$(find _site -type f | wc -l)" -eq 80
      - name: Add standalone review prototypes without changing the application
        run: |
          echo "4fc1567f368794c5653cbe9a28e97c748950affa7b5bd0355bc7769f8d79282e  standalone-previews.zip" | sha256sum --check --strict
          unzip -q standalone-previews.zip -d _site
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static application only
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish Pages
        id: deployment
        uses: actions/deploy-pages@v4
