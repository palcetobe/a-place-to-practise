name: Publish reviewed pilot to Pages
on:
  push:
    branches: [main, retirement-cleanup-20261030, consolidated-packet-after-retirement-20261030]
    # Runtime uploads stage a release; updating its pinned hashes publishes it.
    paths: ['.github/workflows/deploy.yml', 'retirement-cleanup.json', 'consolidated-packet-release.json', 'consolidated-packet.*.b64']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public pilot source
        uses: actions/checkout@v6
      - name: Verify and unpack exact reviewed static application
        run: |
          echo "53349be4d7c1380958241d423992902e601a638659780127a75d5885ce90391e  pilot-runtime.zip" | sha256sum --check --strict
          unzip -q pilot-runtime.zip -d _site
          echo "bf21429d30b1f3b1845d580c1589a70cdeb8845a76b35d87b94eead494b2cee4  pilot-media.zip" | sha256sum --check --strict
          unzip -q pilot-media.zip -d _site
          echo "3f7016eda974bf39cf4c2384b724e411fd23fe7d2d40681809906feb9cdea7f4  _site/index.html" | sha256sum --check --strict
          test "$(find _site -type f | wc -l)" -eq 231
      - name: Add standalone review prototypes without changing the application
        run: |
          echo "4fc1567f368794c5653cbe9a28e97c748950affa7b5bd0355bc7769f8d79282e  standalone-previews.zip" | sha256sum --check --strict
          unzip -q standalone-previews.zip -d _site
      - name: Add isolated tool-finding review without changing existing pages
        run: |
          echo "3156a3a70a27b90ca13c56cb188888f6caf74d13c5910e6279f4af0ce128d74b  tool-finding-review.zip" | sha256sum --check --strict
          unzip -q tool-finding-review.zip -d _site
      - name: Add exact recovered PMR recordings to separate review only
        run: |
          echo "053882ed9fb8dafb67e17e68a42445e686be97ada5690f5dab9abaee97df91a6  pmr-review-media.zip" | sha256sum --check --strict
          unzip -q pmr-review-media.zip -d _site
      - name: Add thought record review to consolidated review
        run: |
          echo "5ed720e7480804210e2d23f0af8d57925a2df856e0599338022551347a101a14  thought-record-review.zip" | sha256sum --check --strict
          unzip -q thought-record-review.zip -d _site
      - name: Add thought record review video to consolidated review
        run: |
          echo "f8f3c87f899e3ab873ae7fc6b1b2de21b16000608fedfeae6263753cf8681a80  thought-record-review-video.zip" | sha256sum --check --strict
          unzip -q thought-record-review-video.zip -d _site
      - name: Add thought record review audio to consolidated review
        run: |
          echo "258b272a20203869ef501553d15a496590a6e10c482d01e752f1df815e824e0d  thought-record-review-audio.zip" | sha256sum --check --strict
          unzip -q thought-record-review-audio.zip -d _site
      - name: Add reviewed fixed narration and generic selected-word bank
        run: |
          echo "1d6179fe633cbf578525a1a2f6b893aea1892b3d12b98a9f2d226942e7ea4216  completion-review-audio.zip" | sha256sum --check --strict
          unzip -q completion-review-audio.zip -d _site
      - name: Add separate draft client review package 2
        run: |
          echo "ebb74a5c786b98a5e3dd98fdd5c928c798b86577c7b38a2f74c9de49e20109bd  client-review-package-2.zip" | sha256sum --check --strict
          test ! -e _site/previews/client-review-package-2
          mkdir -p _site/previews/client-review-package-2
          unzip -q client-review-package-2.zip -d _site/previews/client-review-package-2
          test "$(find _site/previews/client-review-package-2 -type f | wc -l)" -eq 16
      - name: Install the verified integrated project working draft
        run: |
          find _site/previews -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/preserved-previews.sha256
          cat integrated-working-draft.zip.part01a integrated-working-draft.zip.part01b integrated-working-draft.zip.part02a integrated-working-draft.zip.part02b integrated-working-draft.zip.part03a integrated-working-draft.zip.part03b integrated-working-draft.zip.part04a integrated-working-draft.zip.part04b integrated-working-draft.zip.part05a integrated-working-draft.zip.part05b integrated-working-draft.zip.part06a integrated-working-draft.zip.part06b integrated-working-draft.zip.part07a integrated-working-draft.zip.part07b integrated-working-draft.zip.part08 > /tmp/integrated-working-draft.zip
          echo "02c511a6ffecd742e67e9fcaaa83445186d12fa47331c26ca2cbdf86fe395070  /tmp/integrated-working-draft.zip" | sha256sum --check --strict
          python3 - <<'PYZIP'
          from pathlib import PurePosixPath
          from zipfile import ZipFile
          with ZipFile('/tmp/integrated-working-draft.zip') as archive:
              assert len(archive.infolist()) == 499
              assert archive.testzip() is None
              for entry in archive.infolist():
                  path = PurePosixPath(entry.filename)
                  assert not path.is_absolute() and '..' not in path.parts
                  assert path.parts[0] != 'previews' and '\\' not in entry.filename
                  assert (entry.external_attr >> 16) & 0o170000 != 0o120000
              archive.extractall('_site')
          PYZIP
          (cd _site && sha256sum --check --strict _integrated_manifest.sha256)
          cat native-fixed-narration.zip.part01 native-fixed-narration.zip.part02 native-fixed-narration.zip.part03 native-fixed-narration.zip.part04 native-fixed-narration.zip.part05 > /tmp/native-fixed-narration.zip
          echo "c4714fa5325fb9bc194513366f077e2a4fef0bdd54e69ce80cb024f75490c21a  /tmp/native-fixed-narration.zip" | sha256sum --check --strict
          python3 - <<'PYNARR'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          with ZipFile('/tmp/native-fixed-narration.zip') as recordings:
              assert len(recordings.infolist()) == 143
              assert recordings.testzip() is None
              for entry in recordings.infolist():
                  path = PurePosixPath(entry.filename)
                  assert len(path.parts) == 3 and path.parts[:2] == ('narration-approved', 'native-full')
                  assert not path.is_absolute() and '..' not in path.parts and path.suffix == '.mp3'
                  assert (entry.external_attr >> 16) & 0o170000 != 0o120000
                  assert not (Path('_site') / entry.filename).exists()
              recordings.extractall('_site')
          PYNARR
          cat approved-native-teaching.zip.part01 approved-native-teaching.zip.part02 approved-native-teaching.zip.part03 > /tmp/approved-native-teaching.zip
          echo "e49cd325dbd7b32c5d74703a8fc4729cacd0912fc3078e3273c657f89aff703e  /tmp/approved-native-teaching.zip" | sha256sum --check --strict
          python3 - <<'PYTEACH'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          with ZipFile('/tmp/approved-native-teaching.zip') as recordings:
              assert len(recordings.infolist()) == 33
              assert recordings.testzip() is None
              for entry in recordings.infolist():
                  path = PurePosixPath(entry.filename)
                  assert len(path.parts) == 3 and path.parts[:2] == ('narration-approved', 'teaching')
                  assert not path.is_absolute() and '..' not in path.parts and path.suffix == '.wav'
                  assert (entry.external_attr >> 16) & 0o170000 != 0o120000
                  assert not (Path('_site') / entry.filename).exists()
              recordings.extractall('_site')
          PYTEACH
          echo "ea71aa2430f78b05032bf3e825b50dc9996fea688d921c350fe548326a5b196f  integrated-guide-link-fix.zip" | sha256sum --check --strict
          unzip -oq integrated-guide-link-fix.zip -d _site
          (cd _site && sha256sum --check --strict _integrated_manifest.sha256)
          sha256sum --check --strict /tmp/preserved-previews.sha256
      - name: Install exact approved consolidated packet on verified baseline
        run: |
          python3 - <<'PYCONSOLIDATED'
          import base64,hashlib,io,json,pathlib,zipfile
          root=pathlib.Path('_site');sha=lambda b:hashlib.sha256(b).hexdigest()
          raw=pathlib.Path('consolidated-packet-release.json').read_bytes()
          assert sha(raw)=='6339a94a6d502f8c165baed7410a8b410cc998f1bbb9c7765dc24f21cb91a41d', 'Consolidated manifest checksum mismatch'
          m=json.loads(raw);assert m['schema']=='aptp-consolidated-after-retirement-v1'
          c=json.loads(pathlib.Path('retirement-cleanup.json').read_text())
          assert m['baselineFiles']==c['beforeFiles'] and len(m['baselineFiles'])==697
          def app_census():
              out={}
              for p in root.rglob('*'):
                  assert not p.is_symlink()
                  if p.is_file():
                      name=p.relative_to(root).as_posix()
                      if not name.startswith('previews/') and name!='_integrated_manifest.sha256':out[name]=sha(p.read_bytes())
              return out
          assert app_census()==m['baselineFiles'], 'Whole 697-file baseline mismatch before consolidated delta'
          parts=[]
          assert len(m['parts'])==15
          for i,part in enumerate(m['parts'],1):
              assert part['path']==f'consolidated-packet.part{i:02d}.b64'
              content=pathlib.Path(part['path']).read_bytes()
              assert len(content)==part['bytes'] and sha(content)==part['sha256'], 'Part checksum mismatch'
              assert content.endswith(b'\n') and not content.endswith(b'\n\n'), 'Expected exactly one text-editor terminal LF'
              parts.append(content[:-1])
          blob=base64.b64decode(b''.join(parts),validate=True)
          assert len(blob)==m['archiveBytes'] and sha(blob)==m['archiveSHA256']=='baae7fcac80f09bc6af7c07c9f0b2a09e6e5041f702a0f42c48103ffb6c7acc9'
          delta={d['path']:d for d in m['delta']};assert len(delta)==56
          assert len(m['preRetirementFiles'])==741
          assert not set(delta)&set(m['requiredRetirements'])
          for name,d in delta.items():assert d['before']==m['baselineFiles'].get(name) and d['after']==m['preRetirementFiles'][name]
          with zipfile.ZipFile(io.BytesIO(blob)) as z:
              assert len(z.infolist())==56 and set(z.namelist())==set(delta) and z.testzip() is None
              for entry in z.infolist():
                  p=pathlib.PurePosixPath(entry.filename)
                  assert not p.is_absolute() and '..' not in p.parts and '\\' not in entry.filename
                  assert p.parts[0]!='previews' and entry.filename!='_integrated_manifest.sha256'
                  assert (entry.external_attr>>16)&0o170000 != 0o120000
                  assert sha(z.read(entry))==delta[entry.filename]['after']
              for entry in z.infolist():
                  target=root/entry.filename;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(z.read(entry))
          assert app_census()==m['preRetirementFiles'], 'Whole 741-file consolidated result mismatch'
          print(json.dumps({'consolidatedDeltaFiles':56,'addedFiles':44,'modifiedFiles':12,'verifiedPreRetirementFiles':741,'narrationFiles':38}))
          PYCONSOLIDATED
      - name: Apply unchanged retirement payload last and verify whole final tree
        run: |
          python3 - <<'PYRETIRE'
          import base64, hashlib, io, json, pathlib, zipfile
          root=pathlib.Path('_site')
          sha=lambda b:hashlib.sha256(b).hexdigest()
          raw=pathlib.Path('retirement-cleanup.json').read_bytes()
          assert sha(raw)=="4703c8be9a3602a39d60530629cd1309a6cf965dd727888d1d9039d959893111", 'Text transport checksum mismatch'
          p=json.loads(raw)
          assert p['schema']=='aptp-retirement-overlay-v1'
          before=json.loads(pathlib.Path('consolidated-packet-release.json').read_text())['preRetirementFiles']; changes=p['changes']
          assert len(before)==741 and len(changes)==45
          assert len({c['path'] for c in changes})==45
          assert sum(c['path'].endswith('.html') for c in changes)==44
          assert {c['path'] for c in changes if not c['path'].endswith('.html')}=={'review-hub.js'}
          def census():
              result={}
              for path in root.rglob('*'):
                  assert not path.is_symlink(), 'Unexpected symlink'
                  if path.is_file(): result[path.relative_to(root).as_posix()]=sha(path.read_bytes())
              return result
          all_before=census()
          previews={k:v for k,v in all_before.items() if k.startswith('previews/')}
          assert previews, 'Preserved previews missing'
          app={k:v for k,v in all_before.items() if not k.startswith('previews/') and k!='_integrated_manifest.sha256'}
          missing=sorted(set(before)-set(app));extra=sorted(set(app)-set(before));changed=sorted(k for k in set(app)&set(before) if app[k]!=before[k])
          assert not (missing or extra or changed), json.dumps({'wholeTreeMismatch':True,'missing':missing,'extra':extra,'changed':changed})
          blob=base64.b64decode(p['archiveBase64'],validate=True)
          assert sha(blob)==p['archiveSHA256']=='b778b3f034c9f74df7f39ca8eb84dc620ed2bb5d85514872eaf189db78c529ab'
          after=dict(before)
          for c in changes:
              assert c['before']==before[c['path']]
              after[c['path']]=c['after']
          with zipfile.ZipFile(io.BytesIO(blob)) as z:
              assert z.testzip() is None
              assert len(z.infolist())==45 and set(z.namelist())=={c['path'] for c in changes}
              for entry in z.infolist():
                  path=pathlib.PurePosixPath(entry.filename)
                  assert not path.is_absolute() and '..' not in path.parts and '\\' not in entry.filename
                  assert path.parts[0] in ('drafts','recovered') or entry.filename=='review-hub.js'
                  assert (entry.external_attr>>16)&0o170000 != 0o120000
                  assert sha(z.read(entry))==after[entry.filename]
              for entry in z.infolist(): (root/entry.filename).write_bytes(z.read(entry))
          all_after=census()
          assert {k:v for k,v in all_after.items() if k.startswith('previews/')}==previews
          assert {k:v for k,v in all_after.items() if not k.startswith('previews/') and k!='_integrated_manifest.sha256'}==after
          manifest=''.join(v+'  '+k+'\n' for k,v in sorted(after.items()))
          (root/'_integrated_manifest.sha256').write_text(manifest,encoding='utf-8',newline='\n')
          assert (root/'_integrated_manifest.sha256').read_text()==manifest
          print(json.dumps({'approvedHTMLNotices':44,'hostRetirement':1,'applicationFilesVerified':len(after),'preservedPreviewFiles':len(previews),'unchangedApplicationFiles':len(after)-45,'archiveSHA256':p['archiveSHA256']}))

          release=json.loads(pathlib.Path('consolidated-packet-release.json').read_text())
          assert after==release['finalFiles']
          assert all(after[k]==v for k,v in release['requiredRetirements'].items())
          print(json.dumps({'retirementInvariantsVerified':45,'finalApplicationFiles':741}))
          PYRETIRE
          (cd _site && sha256sum --check --strict _integrated_manifest.sha256)
          sha256sum --check --strict /tmp/preserved-previews.sha256
      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload static application only
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish Pages
        id: deployment
        uses: actions/deploy-pages@v4
